spring:
  application:
    name: payment-service

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    topics:
      payment-events:
        name: ${KAFKA_TOPIC_PAYMENT_EVENTS_NAME}
        partitions: ${KAFKA_TOPIC_PAYMENT_EVENTS_PARTITIONS}
        replicas: ${KAFKA_TOPIC_PAYMENT_EVENTS_REPLICAS}

external:
  random-number:
    url: ${RANDOM_NUMBER_URL}

security:
  jwt:
    secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      random-number:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTLP_METRICS_URL}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGS_URL}